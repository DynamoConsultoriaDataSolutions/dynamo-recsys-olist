name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs: 
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt
        
      - name: Correr tests
        run: pytest -q